services:
  webhook:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Listen in the container; the port binding below keeps the host endpoint local.
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_URL: http://127.0.0.1:8000/webhook
      ACCOUNT_DB_FILE: /data/account_state.db
      TRADE_STATE_FILE: /data/trade_state.json
      WEBHOOK_LOG_FILE: /data/webhook.log
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - webhook-data:/data
    networks:
      mt5-webhook:
        # MT5 accepts this fully-qualified hostname in its WebRequest whitelist.
        aliases:
          - webhook.local
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webhook-data:

# This network is created once and shared with ../mt5.
networks:
  mt5-webhook:
    name: mt5-webhook
    external: true
