services:
  webhook:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Listen in the container; the port binding below keeps the host endpoint local.
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_URL: http://trade-config.home.arpa/webhook
      ACCOUNT_DB_FILE: /data/account_state.db
      TRADE_STATE_FILE: /data/trade_state.json
      WEBHOOK_LOG_FILE: /data/webhook.log
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - webhook-data:/data
    networks:
      mt5-webhook:
        # MT5 accepts this fully-qualified hostname in its WebRequest whitelist.
        aliases:
          - webhook.local
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.trade-config.rule=Host(`trade-config.home.arpa`)"
      - "traefik.http.routers.trade-config.entrypoints=web"
      - "traefik.http.services.trade-config.loadbalancer.server.port=8000"
      - "traefik.http.routers.trade-config-home.rule=Host(`trade-config.home.arpa`) && Path(`/`)"
      - "traefik.http.routers.trade-config-home.entrypoints=web"
      - "traefik.http.routers.trade-config-home.middlewares=trade-config-dashboard"
      - "traefik.http.routers.trade-config-home.service=trade-config"
      - "traefik.http.middlewares.trade-config-dashboard.redirectregex.regex=^https?://[^/]+/?$"
      - "traefik.http.middlewares.trade-config-dashboard.redirectregex.replacement=/dashboard"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webhook-data:

# This network is created once and shared with ../mt5.
networks:
  mt5-webhook:
    name: mt5-webhook
    external: true
  proxy:
    external: true
